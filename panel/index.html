<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus">
<title>Nexus Panel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>var t="midnight";try{t=localStorage.getItem("nexus.theme")||t}catch(e){}if(t!=="auto")document.documentElement.setAttribute("data-theme",t)</script>
<script>
/* Telefonda konsol olmadığı için hatayı ekranda küçük bir bantla göster */
window.onerror=function(msg,src,line){
  try{
    var d=document.createElement('div');
    d.className='errband';
    d.textContent='Hata: '+msg+' ('+String(src||'').split('/').pop()+':'+line+')';
    d.onclick=function(){d.remove()};
    document.documentElement.appendChild(d);
  }catch(e){}
};
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app-wrap">
  <header class="top">
    <button id="topMenu" class="ib top-menu" type="button" data-act="menu" aria-label="Menü"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h16"/></svg></button>
    <img id="topLogo" class="top-logo" src="icons/icon-192.png" alt="" width="28" height="28">
    <h1 id="topTitle" class="top-t">Nexus</h1>
    <button id="topSet" class="ib top-set" type="button" data-act="set" aria-label="Görünüm ve ses"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <main id="v-apps" aria-label="Uygulamalar"></main>

  <section id="v-yonet" class="off" aria-label="Yönet"><div id="adm" class="adm"></div></section>

</div>

<div id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-bg" data-act="mclose"></div>
  <nav id="drawerBody" class="drawer-p" role="dialog" aria-modal="true" aria-label="Menü"></nav>
</div>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-bg" data-act="close"></div>
  <div class="sheet-p" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>window.NEXUS_PANEL=true</script>
<script src="apps.js"></script>
<script src="01-core.js"></script>
<script src="02-apps.js"></script>
<script src="03-install.js"></script>
<script src="fx.js"></script>
<script src="04-boot.js"></script>
<script src="panel/panel.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.addEventListener('updatefound',function(){
      var w=reg.installing;
      if(!w)return;
      w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller&&window.toast){
          toast('Güncelleme hazır','info','Uygulamayı kapatıp aç');
        }
      });
    });
  }).catch(function(){});
}
</script>
</body>
</html>
