<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nexus Panel · Giriş</title>
<script>var t="midnight";try{t=localStorage.getItem("nexus.theme")||t}catch(e){}if(t!=="auto")document.documentElement.setAttribute("data-theme",t)</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="stp lg">
<div class="lg-bg" aria-hidden="true"><i class="lg-c lg-c1"></i><i class="lg-r lg-r1"></i><i class="lg-c lg-c2"></i><i class="lg-r lg-r2"></i></div>
<main id="card" class="st-card lg-card">
  <div class="lg-ic"><img src="icons/icon-192.png" alt="" width="72" height="72"></div>
  <h1 class="st-h">Yönetici Paneli</h1>
  <p class="st-p">Devam etmek için yönetici anahtarını gir.</p>
  <form id="lf" class="lg-form" novalidate>
    <div class="lg-f">
      <svg class="lg-fi" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3M12 15v1.5"/></svg>
      <input id="key" class="lg-in" type="password" placeholder="Yönetici anahtarı" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Yönetici anahtarı">
      <button id="eye" class="lg-eye" type="button" aria-label="Anahtarı göster" aria-pressed="false">
        <svg class="e-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2A9.6 9.6 0 0 1 12 6c5 0 8.5 4 9.5 6a12 12 0 0 1-2.6 3.3M6.6 7.7A12 12 0 0 0 2.5 12C3.5 14 7 18 12 18c1.4 0 2.7-.3 3.8-.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        <svg class="e-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12C3.5 10 7 6 12 6s8.5 4 9.5 6c-1 2-4.5 6-9.5 6s-8.5-4-9.5-6z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button id="go" class="btn btn-pri lg-go" type="submit">
      <span>Giriş Yap</span>
      <svg class="lg-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <i class="lg-spin" aria-hidden="true"></i>
    </button>
    <p id="err" class="st-err" role="alert"></p>
  </form>
  <p class="lg-ft"><span>© 2026 Nexus</span></p>
</main>
<script src="panel/login.js"></script>
</body>
</html>
