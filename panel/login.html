<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nexus Panel · Giriş</title>
<script>try{var t=localStorage.getItem("nexus.theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="stp">
<main id="card" class="st-card">
  <img class="st-logo" src="icons/icon-192.png" alt="" width="64" height="64">
  <h1 class="st-h">Panel</h1>
  <p class="st-p">Yönetici anahtarını gir.</p>
  <input id="key" class="adm-in" type="password" placeholder="Yönetici anahtarı" autocomplete="current-password">
  <button id="go" class="btn btn-pri st-btn" type="button">Giriş</button>
  <p id="err" class="st-err" role="alert"></p>
</main>
<script src="panel/login.js"></script>
</body>
</html>
