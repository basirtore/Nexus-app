<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus">
<title>Nexus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>var t="midnight";try{t=localStorage.getItem("nexus.theme")||t}catch(e){}if(t!=="auto")document.documentElement.setAttribute("data-theme",t)</script>
<script>
/* Telefonda konsol olmadığı için hatayı ekranda küçük bir bantla göster */
window.onerror=function(msg,src,line){
  try{
    var d=document.createElement('div');
    d.className='errband';
    d.textContent=(window.T?T('Hata'):'Hata')+': '+msg+' ('+String(src||'').split('/').pop()+':'+line+')';
    d.onclick=function(){d.remove()};
    document.documentElement.appendChild(d);
  }catch(e){}
};
</script>
<script>
/* Nexus'un kendi yükleme isteğini erken yakala (kart ve üst düğme kullanır) */
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__nxIP=e;try{if(window.nxInstSync)nxInstSync()}catch(x){}});
window.addEventListener('appinstalled',function(){window.__nxIP=null;window.__nxDone=1;try{if(window.nxInstSync)nxInstSync()}catch(x){}});
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="g pub">

<div class="g-deco" aria-hidden="true">
  <svg class="g-wv g-wv-t" viewBox="0 0 400 240" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M-10 40C60 10 130 120 200 80S340 -20 410 50"/><path d="M-10 70C60 40 130 150 200 110S340 10 410 80"/><path d="M-10 100C60 70 130 180 200 140S340 40 410 110"/></svg>
  <svg class="g-wv g-wv-b" viewBox="0 0 400 240" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M-10 170C70 120 150 230 230 180S350 110 410 150"/><path d="M-10 200C70 150 150 260 230 210S350 140 410 180"/><path d="M-10 230C70 180 150 290 230 240S350 170 410 210"/></svg>
</div>

<div id="app" class="app-wrap">
  <header class="top">
    <img id="topLogo" class="top-logo" src="icons/icon-192.png" alt="" width="28" height="28" data-act="tap" data-snd="none" draggable="false">
    <h1 id="topTitle" class="top-t">Nexus</h1>
    <button id="topInst" class="ib top-inst off" type="button" data-act="nxinst" data-snd="none" aria-label="Nexus'u yükle" data-i18n-label="Nexus'u yükle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg></button>
  <div id="langBox" class="lang"></div>
    <button id="topSet" class="ib top-set" type="button" data-act="set" aria-label="Görünüm ve ses" data-i18n-label="Görünüm ve ses"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <section id="pubHero" class="g-hero pub-hero"></section>

  <main id="v-apps" aria-label="Uygulamalar" data-i18n-label="Uygulamalar"></main>

  <footer id="ft" class="g-ft">
    <div class="g-ft-nm"><img src="icons/icon-192.png" alt="" width="30" height="30"><b>Nexus</b></div>
  </footer>

</div>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-bg" data-act="close"></div>
  <div class="sheet-p" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>window.NEXUS_PUB=true</script>
<script src="apps.js"></script>
<script src="i18n.js"></script>
<script src="01-core.js"></script>
<script src="02-apps.js"></script>
<script src="03-install.js"></script>
<script src="fx.js"></script>
<script src="04-boot.js"></script>
<script src="geri.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.addEventListener('updatefound',function(){
      var w=reg.installing;
      if(!w)return;
      w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller&&window.toast){
          toast(T('Güncelleme hazır'),'info',T('Uygulamayı kapatıp aç'));
        }
      });
    });
  }).catch(function(){});
}
</script>
</body>
</html>
