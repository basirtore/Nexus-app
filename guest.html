<script>var t="midnight";try{t=localStorage.getItem("nexus.theme")||t}catch(e){}if(t!=="auto")document.documentElement.setAttribute("data-theme",t)</script>
<script>
/* Telefonda konsol olmadığı için hatayı ekranda küçük bir bantla göster */
window.onerror=function(msg,src,line){
  try{
    var d=document.createElement('div');
    d.className='errband';
    d.textContent='Hata: '+msg+' ('+String(src||'').split('/').pop()+':'+line+')';
    d.onclick=function(){d.remove()};
    document.documentElement.appendChild(d);
  }catch(e){}
};
</script>

/* Servis çalışanı yalnız önbellek için kayıt olur. Sayfayı ASLA otomatik yeniden yükleme: davet linki her açılışta
   bir kullanım hakkı düşer, yeniden yükleme tek kullanımlık linki geçersiz kılar ve N kullanımlıkta fazladan hak harcar. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(r){r.update()}).catch(function(){});
}
